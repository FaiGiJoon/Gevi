<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEVI - Gameboy Emulator Tool</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #d4d4d4;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #333;
            padding: 1rem;
            text-align: center;
            border-bottom: 2px solid #9bbc0f;
        }
        main {
            display: grid;
            grid-template-columns: 300px 1fr;
            flex: 1;
            overflow: hidden;
        }
        #sidebar {
            background-color: #252526;
            padding: 1rem;
            border-right: 1px solid #3c3c3c;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        #content {
            padding: 1rem;
            overflow-y: auto;
        }
        .card {
            background-color: #333;
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 1rem;
        }
        button {
            background-color: #9bbc0f;
            color: #0f380f;
            border: none;
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-weight: bold;
            border-radius: 2px;
        }
        button:hover {
            background-color: #8bab0f;
        }
        select, input {
            padding: 0.5rem;
            background-color: #3c3c3c;
            color: white;
            border: 1px solid #555;
        }
        .palette-preview {
            display: flex;
            gap: 5px;
            margin-top: 5px;
        }
        .color-box {
            width: 20px;
            height: 20px;
            border: 1px solid #000;
        }
        pre {
            background-color: #000;
            padding: 0.5rem;
            overflow-x: auto;
        }
        .status-badge {
            padding: 0.2rem 0.5rem;
            border-radius: 10px;
            font-size: 0.8rem;
        }
        .status-ok { background-color: #306230; color: #fff; }
        button:focus-visible, select:focus-visible {
            outline: 2px solid #9bbc0f;
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <header>
        <h1>GEVI Middleware Console</h1>
    </header>
    <main>
        <div id="sidebar">
            <div class="card">
                <h3>System</h3>
                <p>Status: <span id="status" class="status-badge status-ok">Connected</span></p>
                <button id="refresh-status-btn" onclick="checkStatus()">Refresh Status</button>
            </div>
            <div class="card">
                <h3>Palette</h3>
                <label for="palette-select" style="display: block; margin-bottom: 0.5rem;">Select Palette:</label>
                <select id="palette-select" onchange="changePalette()">
                    <!-- Options populated by JS -->
                </select>
                <div id="palette-preview" class="palette-preview"></div>
            </div>
            <div class="card">
                <h3>Tools</h3>
                <button onclick="getTiles()">View Tile Data</button>
                <button onclick="inspectMemory()">Inspect Memory</button>
                <button onclick="disassemble()">Disassemble</button>
            </div>
        </div>
        <div id="content">
            <div id="output" class="card">
                <h3>Output</h3>
                <pre id="output-log" aria-live="polite">Welcome to GEVI GUI. System ready.</pre>
            </div>
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
